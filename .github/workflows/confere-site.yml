# Testes de navegador do site: movimento reduzido (scripts/confere-calmo.mjs), parede de palavras
# da Home (scripts/confere-parede.mjs), barras presas no topo, na rolagem e no toque
# (scripts/confere-barra.mjs) e pilha do Trio no Sobre (scripts/confere-pilha.mjs). Antes deles,
# a guarda do histórico pelo git (scripts/confere-arquivo.mjs) e o build.
#
# Quando roda (GitHub Actions enxuto, do Gui, 20 nov 2026): só por disparo manual ("Run workflow"
# na aba Actions, escolhendo a branch). A conversa dispara na design antes de cada rodada para a
# main. Nada roda sozinho em push ou PR: a Cloudflare já faz o build de cada push, e o build
# ("npm run build") traz a guarda da produção, os tipos do Astro e as conferências rápidas (temas,
# links, agenda, atrações e exemplos). Se algo falha lá, a Cloudflare não publica.
#
# O build aqui roda sem as chaves das plataformas: a agenda sai só com o histórico arquivado,
# o que basta para conferir movimento e rolagem. Ver CLAUDE.md, "Conferências do site".
name: Confere o site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    # Uma rodada normal leva uns 4 minutos. Travada, para aqui e não come a cota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: a guarda do histórico lê as mensagens dos commits à procura de
          # [arquivo-editado].
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Primeiro passo, e sem depender do npm ci: se o histórico foi mexido, falha logo.
      - name: Histórico preservado (arquivo desta branch contra o da main)
        run: node scripts/confere-arquivo.mjs
      - run: npm ci
      # O mesmo build da Cloudflare: guarda da produção, tipos, site e conferências rápidas.
      - name: Gera o site (com as conferências rápidas)
        run: npm run build
      # Os navegadores ficam guardados entre as rodadas, com a versão do Playwright na chave:
      # muda a versão, baixa de novo. As bibliotecas do sistema não cabem no cache, então o
      # install continua rodando; com o navegador já lá, ele só confere e segue.
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Navegadores guardados
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      - name: Navegador para a conferência de movimento
        run: npx playwright install --with-deps --only-shell chromium
      # O WebKit é da mesma geração do Safari do iPhone e é quem mostra o pulo da barra no toque.
      - name: Navegador para a conferência das barras presas
        run: npx playwright install --with-deps webkit
      - name: Movimento reduzido
        run: npm run confere:calmo
      - name: Parede de palavras da Home (nenhuma fileira abre buraco)
        run: npm run confere:parede
      - name: Barras presas no topo (rolagem e toque num ano)
        run: npm run confere:barra
      - name: Pilha do Trio no Sobre (cartões que assentam, no toque)
        run: npm run confere:pilha
