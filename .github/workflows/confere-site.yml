# Conferências do site: a cada push fora da main, gera o site e confere os links internos
# (scripts/confere-links.mjs), o contraste dos temas, com o subtema vivo
# (scripts/confere-temas.mjs), a Agenda completa (scripts/confere-agenda.mjs) e o movimento
# reduzido (scripts/confere-calmo.mjs), a parede de palavras da Home (scripts/confere-parede.mjs)
# e as barras presas no topo, na rolagem e no toque (scripts/confere-barra.mjs), e a pilha do
# Trio no Sobre (scripts/confere-pilha.mjs).
# O build aqui roda sem as chaves das plataformas: a agenda sai só com o histórico arquivado,
# o que basta para conferir links, cores e movimento. Ver CLAUDE.md, "Achado vira conferência".
name: Confere o site

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gera o site
        run: npm run build
      # Depois do build, para incluir os temas das páginas de pessoa.
      - name: Contraste dos temas e do subtema vivo
        run: npm run confere:temas
      - name: Links internos, âncoras e imagens
        run: npm run confere:links
      - name: Agenda completa (todo evento do arquivo aparece)
        run: npm run confere:agenda
      - name: Navegador para a conferência de movimento
        run: npx playwright install --with-deps --only-shell chromium
      - name: Movimento reduzido
        run: npm run confere:calmo
      - name: Parede de palavras da Home (nenhuma fileira abre buraco)
        run: npm run confere:parede
      # O WebKit é da mesma geração do Safari do iPhone e é quem mostra o pulo da barra no toque.
      - name: Navegador para a conferência das barras presas
        run: npx playwright install --with-deps webkit
      - name: Barras presas no topo (rolagem e toque num ano)
        run: npm run confere:barra
      - name: Pilha do Trio no Sobre (cartões que assentam, no toque)
        run: npm run confere:pilha
