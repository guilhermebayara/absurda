# Conferências do site, num trabalho só: a guarda do histórico (scripts/confere-arquivo.mjs),
# os tipos do Astro e o build, e depois os links internos (scripts/confere-links.mjs), o
# contraste dos temas, com o subtema vivo (scripts/confere-temas.mjs), a Agenda completa
# (scripts/confere-agenda.mjs), o movimento reduzido (scripts/confere-calmo.mjs), a parede de
# palavras da Home (scripts/confere-parede.mjs), as barras presas no topo, na rolagem e no toque
# (scripts/confere-barra.mjs), a pilha do Trio no Sobre (scripts/confere-pilha.mjs) e as
# atrações do Sobre (scripts/confere-atracoes.mjs).
#
# Quando roda (economia de minutos, do Gui, 19 nov 2026):
#   - no PR para a design ou para a main, a cada push na branch do PR;
#   - no push na design (o que entra pelo merge do PR e o que a conversa escreve direto);
#   - nunca quando a mudança é só de documentação (notas/, CLAUDE.md, README.md);
#   - push novo na mesma branch ou no mesmo PR cancela a rodada antiga.
# A main tem o próprio alarme (alarme-arquivo.yml) e recebe a design por fast-forward, já
# conferida. Push numa tst-... ou qa-... sem PR não roda nada: as sessões conferem na máquina.
#
# O build aqui roda sem as chaves das plataformas: a agenda sai só com o histórico arquivado,
# o que basta para conferir links, cores e movimento. Ver CLAUDE.md, "Conferências do site".
name: Confere o site

on:
  push:
    branches: [design]
    paths-ignore:
      - 'notas/**'
      - 'CLAUDE.md'
      - 'README.md'
  pull_request:
    branches: [design, main]
    paths-ignore:
      - 'notas/**'
      - 'CLAUDE.md'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    # Uma rodada normal leva uns 4 minutos. Travada, para aqui e não come a cota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: a guarda do histórico lê as mensagens dos commits à procura de
          # [arquivo-editado].
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Primeiro passo, e sem depender do npm ci: se o histórico foi mexido, falha logo.
      - name: Histórico preservado (arquivo desta branch contra o da main)
        run: node scripts/confere-arquivo.mjs
      - run: npm ci
      - name: Tipos e diagnósticos do Astro
        run: npm run check
      - name: Gera o site
        run: npm run build
      # Depois do build, para incluir os temas das páginas de pessoa.
      - name: Contraste dos temas e do subtema vivo
        run: npm run confere:temas
      - name: Links internos, âncoras e imagens
        run: npm run confere:links
      - name: Agenda completa (todo evento do arquivo aparece)
        run: npm run confere:agenda
      - name: Atrações do Sobre (todo nome do JSON está na página)
        run: npm run confere:atracoes
      # Os navegadores ficam guardados entre as rodadas, com a versão do Playwright na chave:
      # muda a versão, baixa de novo. As bibliotecas do sistema não cabem no cache, então o
      # install continua rodando; com o navegador já lá, ele só confere e segue.
      - name: Versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Navegadores guardados
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      - name: Navegador para a conferência de movimento
        run: npx playwright install --with-deps --only-shell chromium
      # O WebKit é da mesma geração do Safari do iPhone e é quem mostra o pulo da barra no toque.
      - name: Navegador para a conferência das barras presas
        run: npx playwright install --with-deps webkit
      - name: Movimento reduzido
        run: npm run confere:calmo
      - name: Parede de palavras da Home (nenhuma fileira abre buraco)
        run: npm run confere:parede
      - name: Barras presas no topo (rolagem e toque num ano)
        run: npm run confere:barra
      - name: Pilha do Trio no Sobre (cartões que assentam, no toque)
        run: npm run confere:pilha
