# Guarda do histórico: avisa quando uma branch chega com o arquivo de eventos passados
# diferente do que está publicado na main (evento faltando, alterado ou capa apagada).
# Acrescentar eventos é normal e passa. Ver scripts/confere-arquivo.mjs e CLAUDE.md.
name: Confere o histórico

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compara o arquivo desta branch com o da main
        run: node scripts/confere-arquivo.mjs
